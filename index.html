<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D飛行船リングアドベンチャー</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8ed8ff;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0}
#ui{position:fixed;left:12px;right:12px;top:10px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:rgba(255,255,255,.86);border-radius:14px;padding:8px 11px;box-shadow:0 3px 12px #0002;font-weight:700}
button{border:0;border-radius:12px;padding:9px 13px;font-weight:800;background:#fff;box-shadow:0 2px 8px #0002}
#speed{width:110px;vertical-align:middle}
#status{font-size:13px}
#camera{position:fixed;right:12px;bottom:12px;width:145px;height:108px;object-fit:cover;border-radius:14px;transform:scaleX(-1);z-index:4;display:none;border:3px solid #fff}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;background:#ffffffd9;border-radius:15px;padding:9px 13px;text-align:center;font-size:13px}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(#73cfff,#dff7ff)}
.card{width:min(90vw,430px);background:#fff;border-radius:24px;padding:24px;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px #0003}
.card h1{margin:0 0 10px;font-size:28px}.card p{line-height:1.7}
.big{font-size:18px;background:#55b8ff;color:#fff;padding:14px 28px;border-radius:16px}
</style>
</head>
<body>
<div id="game"></div>
<div id="start"><div class="card">
<h1>🎈 3D 飛行船</h1>
<p>顔を動かして飛行船を操縦し、<b>リングをくぐろう！</b><br>
障害物なし。飛行船は画面中央より少し上がホームポジションです。</p>
<button class="big" id="startBtn">カメラを使ってスタート</button>
<p style="font-size:12px">カメラの許可が必要です。うまく動かない時は、下のタッチ操作も使えます。</p>
</div></div>

<div id="ui">
<div class="panel">⭕ リング <span id="score">0</span></div><div class="panel">⏱️ <span id="time">2:00</span></div>
<div class="panel">⏱️ 時間 <select id="duration"><option value="60">1分</option><option value="120" selected>2分</option><option value="180">3分</option></select></div><div class="panel">⚡ 速度 <input id="speed" type="range" min="1" max="10" value="5"> <span id="speedVal">5</span></div>
<div class="panel" id="status">顔操作：準備中</div>
<button id="camBtn">📷 カメラ</button><button id="faceResetBtn">🎯 顔認識リセット</button>
<button id="resetBtn">↻ リセット</button>
</div>
<video id="camera" autoplay playsinline muted></video>
<div id="help">顔を「上・下・左・右」に大きく動かすと、飛行船も大きく動きます　｜　画面タッチでも操作できます</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js"></script>
<script>
let scene,camera,renderer,ship,ringGroup=[],clouds=[],propellers=[];
let score=0, speed=5, durationSeconds=120, faceLandmarker=null, stream=null, gameSeconds=120, gameStart=0, gameEnded=false;
let targetX=0,targetY=2.8, shipX=0,shipY=2.8, shipZ=0, velX=0,velY=0;
let baseX=null,baseY=null,faceReady=false, faceLostFrames=0, lastFaceDetect=0;
let smoothFaceX=0.5,smoothFaceY=0.5, lastTime=performance.now(), ringTimer=0;

const $=id=>document.getElementById(id);
$('speed').oninput=e=>{speed=+e.target.value;$('speedVal').textContent=speed};$('duration').onchange=e=>{durationSeconds=+e.target.value;resetGame()};
$('resetBtn').onclick=()=>resetGame();
$('camBtn').onclick=()=>startCamera();
$('faceResetBtn').onclick=()=>resetFaceCalibration();

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x83d5ff);
 scene.fog=new THREE.Fog(0x83d5ff,35,180);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
 camera.position.set(0,4.5,13);
 camera.lookAt(0,3,-20);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 $('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x72a7cc,2.1));
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,10);scene.add(sun);

 const sea=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshPhongMaterial({color:0x36a9d6}));
 sea.rotation.x=-Math.PI/2;sea.position.y=-2;scene.add(sea);

 for(let i=0;i<15;i++) makeIsland(i);
 for(let i=0;i<30;i++) makeCloud(i);
 makeShip(); resetGame();
 addEventListener('resize',resize);
 addTouchControls();
 animate();
}
function makeIsland(i){
 const g=new THREE.Group();
 const rock=new THREE.Mesh(new THREE.ConeGeometry(3+Math.random()*3,2+Math.random()*2,7),new THREE.MeshPhongMaterial({color:0x8bcf77}));
 rock.position.y=-.5;g.add(rock);
 const top=new THREE.Mesh(new THREE.CylinderGeometry(2+Math.random()*2,2.8+Math.random()*2,0.7,7),new THREE.MeshPhongMaterial({color:0x55b96a}));
 top.position.y=.8;g.add(top);
 g.position.set((Math.random()-.5)*100,-.5,-20-i*12);scene.add(g);
}
function makeCloud(i){
 const g=new THREE.Group();
 for(let j=0;j<5;j++){let m=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*1.5,12,10),new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:.9}));m.position.set(j*1.5,Math.random()*1.3,Math.random());g.add(m)}
 g.position.set((Math.random()-.5)*80,8+Math.random()*20,-10-Math.random()*170);g.scale.setScalar(.7+Math.random()*1.5);scene.add(g);clouds.push(g);
}
function makeShip(){
 ship=new THREE.Group();
 propellers=[];

 // ① まるくてかわいいパステルピンクの気球
 const balloon=new THREE.Mesh(
   new THREE.SphereGeometry(1.55,36,24),
   new THREE.MeshPhongMaterial({color:0xf7b6d2,shininess:90})
 );
 balloon.scale.set(1.08,1.0,1.05);
 balloon.position.y=.35;
 ship.add(balloon);

 // やさしい色の縦帯
 for(const x of [-1.05,-.35,.35,1.05]){
   const band=new THREE.Mesh(
     new THREE.TorusGeometry(.99,.055,10,36),
     new THREE.MeshPhongMaterial({color:0xffe6f1,shininess:60})
   );
   band.rotation.y=Math.PI/2;
   band.position.set(x*.72,.35,0);
   band.scale.set(.98,1,1);
   ship.add(band);
 }

 // 小さくてかわいいゴンドラ
 const cabin=new THREE.Mesh(
   new THREE.BoxGeometry(1.45,.62,1.0),
   new THREE.MeshPhongMaterial({color:0xe8a6bd,shininess:65})
 );
 cabin.position.set(0,-.75,.05);
 ship.add(cabin);

 // ゴンドラの白い縁
 const rim=new THREE.Mesh(
   new THREE.BoxGeometry(1.58,.10,1.08),
   new THREE.MeshPhongMaterial({color:0xfff1f7,shininess:70})
 );
 rim.position.set(0,-.43,.05);
 ship.add(rim);

 // 後ろから見える丸い窓
 for(const x of [-.48,0,.48]){
   const w=new THREE.Mesh(
     new THREE.CylinderGeometry(.14,.14,.055,20),
     new THREE.MeshPhongMaterial({color:0xbfefff,shininess:90})
   );
   w.rotation.x=Math.PI/2;
   w.position.set(x,-.68,.54);
   ship.add(w);
 }

 // 尾翼
 const tailFin=new THREE.Mesh(
   new THREE.ConeGeometry(.48,1.25,4),
   new THREE.MeshPhongMaterial({color:0xd8b4ef,shininess:60})
 );
 tailFin.rotation.x=Math.PI/2;
 tailFin.position.set(0,.35,1.55);
 ship.add(tailFin);

 const leftFin=new THREE.Mesh(
   new THREE.BoxGeometry(.12,.85,.58),
   new THREE.MeshPhongMaterial({color:0xe5b8d0,shininess:55})
 );
 leftFin.position.set(-.92,.35,1.18);
 leftFin.rotation.z=-.35;
 ship.add(leftFin);

 const rightFin=leftFin.clone();
 rightFin.position.x=.92;
 rightFin.rotation.z=.35;
 ship.add(rightFin);

 // 後方の左右プロペラ
 for(const x of [-.72,.72]){
   const motor=new THREE.Mesh(
     new THREE.CylinderGeometry(.18,.18,.38,16),
     new THREE.MeshPhongMaterial({color:0xd7a9bc,shininess:80})
   );
   motor.rotation.x=Math.PI/2;
   motor.position.set(x,-.45,1.12);
   ship.add(motor);

   const hub=new THREE.Mesh(
     new THREE.SphereGeometry(.12,16,12),
     new THREE.MeshPhongMaterial({color:0xfff0a8,shininess:90})
   );
   hub.position.set(x,-.45,1.38);
   ship.add(hub);

   const prop=new THREE.Group();
   for(let a=0;a<3;a++){
     const blade=new THREE.Mesh(
       new THREE.BoxGeometry(.10,.78,.07),
       new THREE.MeshPhongMaterial({color:0xf7b6d2,shininess:70})
     );
     blade.position.y=.34;
     blade.rotation.z=a*Math.PI*2/3;
     prop.add(blade);
   }
   prop.position.set(x,-.45,1.40);
   prop.rotation.z=.2;
   ship.add(prop);
 }

 // 以前と同じ30%小さめ。画面上では扱いやすく、後ろ姿を見やすくする。
 ship.scale.setScalar(.7);
 ship.position.set(0,2.8,2);
 scene.add(ship);
}
function makeRing(z){
 const colors=[0xff4d6d,0xffd43b,0x4dd9ff,0x7ee081,0xb88cff,0xff8c42];
 const shapes=[0,1,2]; const shape=shapes[Math.floor(Math.random()*shapes.length)];
 let geo; if(shape===0) geo=new THREE.TorusGeometry(3.0,.18,14,64); else if(shape===1) geo=new THREE.RingGeometry(2.7,3.0,6); else geo=new THREE.RingGeometry(2.7,3.0,8);
 const ring=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:colors[Math.floor(Math.random()*colors.length)],emissive:0x222222,emissiveIntensity:.25,side:THREE.DoubleSide}));
 ring.position.set((Math.random()-.5)*8,2.5+(Math.random()-.5)*3,z);
 ring.rotation.set(0,0,0); scene.add(ring);ringGroup.push(ring);
}
function resetGame(){
 gameEnded=false; gameSeconds=durationSeconds; gameStart=performance.now(); $('time').textContent=Math.floor(durationSeconds/60)+':00'; score=0;$('score').textContent=score;ringGroup.forEach(r=>scene.remove(r));ringGroup=[];
 for(let i=0;i<10;i++)makeRing(-20-i*22);
 shipX=0;shipY=2.8;targetX=0;targetY=2.8;velX=0;velY=0;
 baseX=null;baseY=null;smoothFaceX=0.5;smoothFaceY=0.5;faceLostFrames=0;
}
function addTouchControls(){
 let sx=0,sy=0;
 renderer.domElement.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
 renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons){targetX+=(e.clientX-sx)*.025;targetY-=(e.clientY-sy)*.025;sx=e.clientX;sy=e.clientY;clampTarget()}});
}
function clampTarget(){targetX=THREE.MathUtils.clamp(targetX,-10,10);targetY=THREE.MathUtils.clamp(targetY,-1,10)}
function resetFaceCalibration(){
  baseX=null;baseY=null;
  smoothFaceX=0.5;smoothFaceY=0.5;
  faceLostFrames=0;
  targetX=0;targetY=2.8;
  velX=0;velY=0;
  if($('status')) $('status').textContent='🎯 顔認識：顔を画面中央にして少し待ってください…';
}
async function startCamera(){
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('getUserMedia is not supported');
  }
  if(stream)stream.getTracks().forEach(t=>t.stop());

  stream=await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{ideal:'user'},
      width:{ideal:640},
      height:{ideal:480},
      frameRate:{ideal:30,max:30}
    },
    audio:false
  });

  const video=$('camera');
  video.srcObject=stream;
  video.style.display='block';
  resetFaceCalibration();
  $('status').textContent='顔操作：カメラ接続中…';

  await video.play();
  if(!video.videoWidth){
    await new Promise(resolve=>{
      const done=()=>{video.removeEventListener('loadedmetadata',done);resolve()};
      video.addEventListener('loadedmetadata',done,{once:true});
    });
  }
  await setupFace();
 }catch(e){
  $('status').textContent='顔操作：カメラを使えません（タッチ操作OK）';
  console.log(e);
 }
}
async function setupFace(){
 try{
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
  const options={
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
    },
    runningMode:'VIDEO',
    numFaces:1,
    minFaceDetectionConfidence:0.5,
    minFacePresenceConfidence:0.5,
    minTrackingConfidence:0.5
  };

  // GPUが使える端末ではGPU、だめならCPUへ自動切替
  try{
    faceLandmarker=await FaceLandmarker.createFromOptions(vision,{
      ...options, baseOptions:{...options.baseOptions,delegate:'GPU'}
    });
  }catch(gpuError){
    console.warn('GPU unavailable, using CPU',gpuError);
    faceLandmarker=await FaceLandmarker.createFromOptions(vision,{
      ...options, baseOptions:{...options.baseOptions,delegate:'CPU'}
    });
  }

  faceReady=true;
  resetFaceCalibration();
  detectFace();
 }catch(e){
  faceReady=false;
  $('status').textContent='顔認識の読み込みに失敗（タッチ操作OK）';
  console.log(e);
} 
}
function detectFace(){
  requestAnimationFrame(detectFace);
  if(!faceReady || !$('camera').videoWidth || !$('camera').videoHeight) return;

  // 顔認識を約30fpsに制限して、スマホでの処理落ち・二重実行を防止
  const now=performance.now();
  if(now-lastFaceDetect<32) return;
  lastFaceDetect=now;

  try{
    const video=$('camera');
    const r=faceLandmarker.detectForVideo(video,now);

    if(r.faceLandmarks && r.faceLandmarks[0]){
      const lm=r.faceLandmarks[0];

      // 鼻1点だけではなく、顔の左右・上下の中心を使うので安定します。
      const left=lm[234], right=lm[454], top=lm[10], bottom=lm[152];
      const faceX=(left.x+right.x)/2;
      const faceY=(top.y+bottom.y)/2;

      // 最初に認識した位置をホームとして保存
      if(baseX===null || baseY===null){
        baseX=faceX;
        baseY=faceY;
        smoothFaceX=faceX;
        smoothFaceY=faceY;
        $('status').textContent='顔操作：ON（中央を基準にしました）';
      }

      // なめらかにして、細かな顔の揺れを吸収
      smoothFaceX += (faceX-smoothFaceX)*0.32;
      smoothFaceY += (faceY-smoothFaceY)*0.32;

      // ホーム付近には小さなデッドゾーンを設定
      let nx=smoothFaceX-baseX;
      let ny=smoothFaceY-baseY;
      if(Math.abs(nx)<0.018) nx=0;
      if(Math.abs(ny)<0.018) ny=0;

      // 大きく動かせる高感度設定
      // カメラ映像は左右反転表示なので、顔を右へ動かすと飛行船も右へ。
      const dx=nx*34;
      const dy=-ny*32;

      targetX=THREE.MathUtils.clamp(dx,-10,10);
      targetY=THREE.MathUtils.clamp(2.8+dy,-1,10);

      faceLostFrames=0;
    }else{
      faceLostFrames++;
      // 一瞬顔を見失っても、飛行船が急に飛ばないよう現在位置を維持
      if(faceLostFrames===1){
        $('status').textContent='顔操作：顔をカメラに入れてください';
      }
    }
  }catch(e){
    console.warn('Face detection:',e);
    // 検出エラー時もゲーム自体は止めない
  }
}
function animate(){
 requestAnimationFrame(animate);
 const now=performance.now();
 if(!gameEnded){ gameSeconds=Math.max(0,durationSeconds-(now-gameStart)/1000); const mm=Math.floor(gameSeconds/60), ss=Math.floor(gameSeconds%60); $('time').textContent=mm+':'+String(ss).padStart(2,'0'); if(gameSeconds<=0){gameEnded=true;$('status').textContent='⏱️ ゴール！ リング '+score+' 個';}}
 const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
 // 加速度的な移動：顔を大きく動かすほど加速し、慣性をつけて移動します。
 const accel=8.0;
 const damping=Math.pow(0.08,dt);
 velX+=(targetX-shipX)*accel*dt;
 velY+=(targetY-shipY)*accel*dt;
 velX*=damping; velY*=damping;
 const maxVel=11;
 velX=THREE.MathUtils.clamp(velX,-maxVel,maxVel);
 velY=THREE.MathUtils.clamp(velY,-maxVel,maxVel);
 shipX+=velX*dt; shipY+=velY*dt;
 if(shipX<-10){shipX=-10;velX=0}
 if(shipX>10){shipX=10;velX=0}
 if(shipY<-1){shipY=-1;velY=0}
 if(shipY>10){shipY=10;velY=0}
 ship.position.x=shipX;ship.position.y=shipY;
 const dx=targetX-shipX,dy=targetY-shipY;
 ship.rotation.z=THREE.MathUtils.clamp(-dx*.34,-1.25,1.25);
 ship.rotation.x=THREE.MathUtils.clamp(dy*.28,-1.05,1.05);
 ship.rotation.y=THREE.MathUtils.clamp(dx*.14,-.65,.65);

 const dz=(gameEnded?0:2+speed*.85)*dt;
 ringGroup.forEach(r=>{r.position.z+=dz;r.rotation.z+=dt*.8});
 for(const r of ringGroup){
  const d=Math.hypot(r.position.x-ship.position.x,r.position.y-ship.position.y);
  if(r.position.z>ship.position.z-1 && r.position.z<ship.position.z+1 && d<2.7){score++;$('score').textContent=score;r.position.z-=150;r.position.x=(Math.random()-.5)*8;r.position.y=2.5+(Math.random()-.5)*3}
  if(r.position.z>12){r.position.z-=160;r.position.x=(Math.random()-.5)*8;r.position.y=2.5+(Math.random()-.5)*3}
 }
 clouds.forEach(c=>{c.position.z+=speed*.15*dt;if(c.position.z>25)c.position.z=-180});
 camera.position.x+=(ship.position.x*.18-camera.position.x)*.03;
 camera.position.y+=(ship.position.y*.12+4.3-camera.position.y)*.03;
 camera.lookAt(ship.position.x*.2,ship.position.y*.35,-25);
 renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
$('startBtn').onclick=async()=>{
  $('start').style.display='none';
  if(!renderer) init();
  await startCamera();
};
</script>
</body>
</html>
