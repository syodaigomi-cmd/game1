<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>顔で飛ぶ！飛行船</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#8bd8ff;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#17324d}.p{position:absolute;background:#ffffffdc;border-radius:18px;padding:12px 16px;box-shadow:0 6px 20px #0002}#st{left:12px;top:12px;font-size:14px}#sc{right:12px;top:12px;font-weight:700}#box{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;width:min(88vw,430px)}button{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:700;background:#2676ff;color:#fff}select,input{font-size:16px}#cam{position:absolute;right:12px;bottom:12px;width:150px;border-radius:14px;opacity:.55;transform:scaleX(-1)}</style></head><body><canvas id="g"></canvas><video id="cam" autoplay muted playsinline></video><div id="ui"><div id="st" class="p">顔認識：待機中</div><div id="sc" class="p">リング 0　速度 0</div><div id="box" class="p"><h2>🎈 顔で飛ぶ！飛行船</h2><p>顔を左右・上下に動かして操縦。ホーム位置は中央より少し上です。</p><p>飛行船：<select id="typ"><option value="cute">かわいい飛行船</option><option value="classic">クラシック</option><option value="cloud">ふわふわ</option></select></p><p>速度：<input id="spd" type="range" min="0.6" max="2.2" step="0.1" value="1.2"></p><button id="go">カメラを起動してスタート</button><p id="msg" style="font-size:12px">HTTPS または localhost で開いてカメラを許可してください。</p></div></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script>
const C=document.getElementById('g'),X=C.getContext('2d'),V=document.getElementById('cam'),st=document.getElementById('st'),sc=document.getElementById('sc'),box=document.getElementById('box'),msg=document.getElementById('msg');let W,H,run=false,ready=false,last=performance.now(),speed=1.2,type='cute',score=0,base={x:null,y:null},target={x:.5,y:.42},ship={x:.5,y:.42,vx:0,vy:0,roll:0,pitch:0},ring;
function rs(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();function r(a,b){return a+Math.random()*(b-a)}function nr(){let s=['circle','ellipse','hex','star'];ring={x:r(.18,.82),y:r(.18,.68),rx:r(42,115),ry:r(42,100),shape:s[Math.floor(Math.random()*s.length)],h:r(0,360),a:r(0,6.28)}}nr();
function face(x,y){if(base.x===null){base={x,y}}target.x=Math.max(0,Math.min(1,.5+(x-base.x)*3.2));target.y=Math.max(0,Math.min(1,.42+(y-base.y)*3.2));ready=true}
function bg(t){let q=X.createLinearGradient(0,0,0,H);q.addColorStop(0,'#72cdf7');q.addColorStop(1,'#d8f5ff');X.fillStyle=q;X.fillRect(0,0,W,H);X.fillStyle='#fff8';for(let i=0;i<9;i++){let x=(i*190+t*.015%220)-100,y=80+i%4*100;X.beginPath();X.ellipse(x,y,55,22,0,0,7);X.ellipse(x+35,y-12,38,28,0,0,7);X.fill()}X.fillStyle='#9ad27a';X.beginPath();X.moveTo(0,H*.78);for(let x=0;x<=W;x+=80)X.lineTo(x,H*.72+Math.sin(x*.012+t*.00015)*35);X.lineTo(W,H);X.lineTo(0,H);X.fill()}
function ringPath(){X.beginPath();if(ring.shape==='circle'||ring.shape==='ellipse')X.ellipse(ring.x*W,ring.y*H,ring.rx,ring.ry,ring.a,0,6.28);else{let n=ring.shape==='hex'?6:10;for(let i=0;i<n;i++){let a=ring.a+i*6.28/n,rr=ring.shape==='hex'?1:(i%2?.48:1),x=ring.x*W+Math.cos(a)*ring.rx*rr,y=ring.y*H+Math.sin(a)*ring.ry*rr;i?X.lineTo(x,y):X.moveTo(x,y)}X.closePath()}}
function dr(){X.save();X.lineWidth=14;X.strokeStyle=`hsl(${ring.h} 85% 55%)`;X.shadowBlur=18;X.shadowColor=`hsl(${ring.h} 90% 60%)`;ringPath();X.stroke();X.lineWidth=4;X.strokeStyle='#fff';ringPath();X.stroke();X.restore()}
function ds(){let x=ship.x*W,y=ship.y*H,s=Math.min(W,H)/700;X.save();X.translate(x,y);X.rotate(ship.roll);X.scale(s,s);if(type==='cloud'){X.fillStyle='#fff';X.beginPath();X.ellipse(0,-35,105,45,0,0,7);X.ellipse(-55,-35,45,34,0,0,7);X.ellipse(55,-35,45,34,0,0,7);X.fill()}else{X.fillStyle=type==='cute'?'#ff9fba':'#d79a55';X.beginPath();X.ellipse(0,-38,115,42,0,0,7);X.fill()}X.fillStyle='#a56b42';X.fillRect(-42,0,84,35);X.fillStyle='#f4d3a0';X.fillRect(-34,5,68,25);X.fillStyle='#6d9fe8';X.beginPath();X.ellipse(0,15,14,9,0,0,7);X.fill();X.strokeStyle='#754b36';X.lineWidth=4;X.beginPath();X.moveTo(-65,-5);X.lineTo(-42,8);X.moveTo(65,-5);X.lineTo(42,8);X.stroke();X.fillStyle='#fff';X.beginPath();X.moveTo(-22,35);X.lineTo(-55,65);X.lineTo(-10,45);X.closePath();X.moveTo(22,35);X.lineTo(55,65);X.lineTo(10,45);X.closePath();X.fill();X.restore()}
function up(dt){let ax=(target.x-.5)*7.5*speed,ay=(target.y-.42)*7.5*speed;ship.vx+=ax*dt;ship.vy+=ay*dt;let d=Math.pow(.10,dt);ship.vx*=d;ship.vy*=d;let m=.42*speed;ship.vx=Math.max(-m,Math.min(m,ship.vx));ship.vy=Math.max(-m,Math.min(m,ship.vy));ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;ship.x=Math.max(.1,Math.min(.9,ship.x));ship.y=Math.max(.14,Math.min(.76,ship.y));ship.roll+=(ship.vx*2.2-ship.roll)*Math.min(1,dt*8);ship.pitch+=(-ship.vy*1.5-ship.pitch)*Math.min(1,dt*7);let dx=ship.x*W-ring.x*W,dy=ship.y*H-ring.y*H;if(dx*dx/(ring.rx*ring.rx)+dy*dy/(ring.ry*ring.ry)<.30){score++;nr()}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;bg(t);if(run){up(dt);st.textContent=ready?'顔認識：操作中':'顔認識：顔を探しています…';sc.textContent=`リング ${score}　速度 ${Math.round(20+Math.hypot(ship.vx,ship.vy)*80)}`}dr();ds();requestAnimationFrame(loop)}requestAnimationFrame(loop);
async function start(){msg.textContent='カメラを起動しています…';try{if(!navigator.mediaDevices)throw Error('camera');let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});V.srcObject=stream;await V.play();let fm=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.55,minTrackingConfidence:.55});fm.onResults(q=>{if(q.multiFaceLandmarks&&q.multiFaceLandmarks.length){let p=q.multiFaceLandmarks[0][1];face(p.x,p.y)}});let cam=new Camera(V,{onFrame:async()=>{await fm.send({image:V})},width:640,height:480});await cam.start();run=true;box.style.display='none';st.textContent='顔認識：操作中'}catch(e){console.error(e);st.textContent='顔認識：起動失敗';msg.textContent='起動失敗。カメラ許可・HTTPS・通信状態を確認して再試行してください。'}}document.getElementById('go').onclick=()=>{speed=+document.getElementById('spd').value;type=document.getElementById('typ').value;score=0;base={x:null,y:null};ship={x:.5,y:.42,vx:0,vy:0,roll:0,pitch:0};start()};
</script></body></html>
