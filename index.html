<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D飛行船・顔操作リングゲーム</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd8ff;font-family:system-ui,sans-serif}#game{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #345}.panel,#controls,#face{background:#0008;border-radius:14px;padding:10px 13px}.panel{position:absolute;top:12px;left:12px;font-weight:700}#controls{position:absolute;top:12px;right:12px;pointer-events:auto}button{border:0;border-radius:10px;padding:10px 14px;margin:3px;font-weight:700}#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;pointer-events:auto}#face{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);text-align:center}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="panel">🎈 リング：<span id="score">0</span>　速度：<span id="speedText">1.0</span></div><div id="controls">速度 <input id="speed" type="range" min=".4" max="2.5" step=".1" value="1"><br><button id="reset">🔄 リセット</button></div><button id="start">▶ 顔操作でスタート</button><div id="face">顔認識：準備中</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script type="module">import{FaceLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";const canvas=document.querySelector('#game'),start=document.querySelector('#start'),reset=document.querySelector('#reset'),faceText=document.querySelector('#face'),scoreText=document.querySelector('#score'),speed=document.querySelector('#speed'),speedText=document.querySelector('#speedText');let scene,camera,renderer,ship,ring,video,landmarker,running=false,score=0,targetX=0,targetY=0,moveX=0,moveY=0;function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd8ff);scene.fog=new THREE.Fog(0x8fd8ff,45,220);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.HemisphereLight(0xdff8ff,0x6b8f50,2.2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-30,60,40);scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x78b85b}));ground.rotation.x=-Math.PI/2;ground.position.y=-20;scene.add(ground);ship=new THREE.Group();let body=new THREE.Mesh(new THREE.SphereGeometry(2.8,32,24),new THREE.MeshStandardMaterial({color:0xf3a34b,roughness:.55}));body.scale.set(1.35,.8,2);ship.add(body);let cabin=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,16),new THREE.MeshStandardMaterial({color:0x8bdcff,transparent:true,opacity:.85}));cabin.scale.set(1,.65,.8);cabin.position.y=1.45;ship.add(cabin);[-1,1].forEach(s=>{let fin=new THREE.Mesh(new THREE.ConeGeometry(.7,2.4,16),new THREE.MeshStandardMaterial({color:0xe5793c}));fin.rotation.z=Math.PI/2;fin.position.x=s*2.8;ship.add(fin)});scene.add(ship);ring=new THREE.Mesh(new THREE.TorusGeometry(5,.55,20,64),new THREE.MeshStandardMaterial({color:0xffdf45,emissive:0x664400}));scene.add(ring);for(let i=0;i<35;i++){let c=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*5,16,12),new THREE.MeshStandardMaterial({color:0xffffff}));c.position.set((Math.random()-.5)*180,15+Math.random()*50,-20-Math.random()*240);c.scale.y=.5;scene.add(c)}resetGame();animate()}function resetGame(){score=0;scoreText.textContent=0;ship.position.set(0,4,0);ship.rotation.set(0,0,0);ring.position.set(0,4,-40);targetX=targetY=moveX=moveY=0}function nextRing(){ring.position.set((Math.random()-.5)*20,2+Math.random()*12,-75-Math.random()*35)}function animate(){requestAnimationFrame(animate);if(running){let sp=Number(speed.value);speedText.textContent=sp.toFixed(1);moveX+=(targetX-moveX)*.12;moveY+=(targetY-moveY)*.12;ship.position.x=moveX;ship.position.y=4+moveY;ship.rotation.z+=(-moveX*.22-ship.rotation.z)*.12;ship.rotation.x+=(moveY*.18-ship.rotation.x)*.12;ship.rotation.y+=(-moveX*.04-ship.rotation.y)*.10;ring.position.z+=sp*.55;if(Math.abs(ring.position.z)<3.2&&Math.hypot(ship.position.x-ring.position.x,ship.position.y-ring.position.y)<5.2){score++;scoreText.textContent=score;nextRing()}if(ring.position.z>8)nextRing()}camera.position.lerp(new THREE.Vector3(ship.position.x*.25,ship.position.y+3.5,15),.07);camera.lookAt(ship.position.x*.55,ship.position.y,ship.position.z-25);renderer.render(scene,camera)}async function startFace(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('camera');video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=true;video.style.display='none';document.body.appendChild(video);video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});await video.play();let fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1});faceText.textContent='顔認識：OK 👍　中央より少し上がホーム位置';track()}catch(e){faceText.textContent='顔認識を起動できません。HTTPSで開き、カメラを許可してください。';console.error(e)}}function track(){if(video&&landmarker&&video.readyState>=2){let r=landmarker.detectForVideo(video,performance.now());if(r.faceLandmarks?.length){let n=r.faceLandmarks[0][1];targetX=Math.max(-16,Math.min(16,(n.x-.5)*-32));targetY=Math.max(-12,Math.min(12,(.42-n.y)*28))}}requestAnimationFrame(track)}start.onclick=async()=>{start.style.display='none';if(!scene)init();running=true;await startFace()};reset.onclick=resetGame;speed.oninput=()=>speedText.textContent=Number(speed.value).toFixed(1);addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});</script></body></html>
