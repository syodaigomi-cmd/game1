<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完全3D 顔操作飛行船</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06152d;font-family:system-ui}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;color:white;pointer-events:none}#s,#score{position:absolute;top:12px;background:#07152dcc;padding:10px 14px;border-radius:14px}#s{left:12px}#score{right:12px}#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;text-align:center;background:#07152de8;padding:25px;border-radius:20px;width:min(86vw,420px)}button{padding:14px 22px;border:0;border-radius:14px;background:#2784ff;color:white;font-size:18px;font-weight:bold}#cam{position:absolute;right:10px;bottom:10px;width:140px;opacity:.4;border-radius:12px;transform:scaleX(-1)}</style></head><body><canvas id="c"></canvas><video id="cam" autoplay muted playsinline></video><div id="ui"><div id="s">顔認識：待機中</div><div id="score">リング 0</div><div id="start"><h2>🚢 完全3D 飛行船</h2><p>顔を上下左右に動かして操縦します。<br>機体選択なし・タッチ操作なし。</p><p>速度 <input id="sp" type="range" min=".7" max="2.4" step=".1" value="1.3"></p><button id="go">カメラを起動してスタート</button><p id="msg" style="font-size:12px">HTTPSまたはlocalhostで開いてカメラを許可してください。</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d'),v=document.getElementById('cam'),S=document.getElementById('s'),Q=document.getElementById('score');let w,h,t=0,run=0,score=0,sp=1.3,bx=null,by=null,tx=0,ty=0,px=0,py=0,vx=0,vy=0,ring;function size(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',size);size();function nr(){ring={x:(Math.random()-.5)*900,y:(Math.random()-.15)*500,z:1300,r:80+Math.random()*100,ry:60+Math.random()*80,h:Math.random()*360}}nr();function face(a,b){if(bx===null){bx=a;by=b;return}tx=Math.max(-1,Math.min(1,(a-bx)*3.5));ty=Math.max(-1,Math.min(1,(b-by)*3.5))}function bg(t){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#58bff5');g.addColorStop(1,'#d8f5ff');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#ffffffaa';for(let i=0;i<8;i++){let a=(i*210+t*.01)%(w+250)-100;x.beginPath();x.ellipse(a,80+(i%4)*90,70,25,0,0,7);x.fill()}x.fillStyle='#75bd78';x.fillRect(0,h*.82,w,h*.18)}function ring(){let sx=w/2+ring.x/(ring.z/900),sy=h*.43+ring.y/(ring.z/900),r=ring.r*900/ring.z,ry=ring.ry*900/ring.z;x.save();x.translate(sx,sy);x.rotate(t*.0005);x.strokeStyle='hsl('+ring.h+' 85% 55%)';x.lineWidth=Math.max(5,r*.13);x.shadowBlur=18;x.shadowColor=x.strokeStyle;x.beginPath();x.ellipse(0,0,r,ry,0,0,7);x.stroke();x.restore()}function ship(){let X=w/2+px,Y=h*.58+py;x.save();x.translate(X,Y);x.rotate(vx*.08);x.fillStyle='#f39ab6';x.beginPath();x.ellipse(0,-45,145,48,0,0,7);x.fill();x.fillStyle='#c47b4d';x.fillRect(-55,0,110,45);x.fillStyle='#f7d4a1';x.fillRect(-43,6,86,28);x.fillStyle='#fff';x.beginPath();x.moveTo(-45,35);x.lineTo(-90,75);x.lineTo(-20,45);x.moveTo(45,35);x.lineTo(90,75);x.lineTo(20,45);x.fill();x.restore()}function loop(z){let dt=Math.min(.033,(z-t)/1000);t=z;bg(z);if(run){vx+=(tx*900*sp)*dt;vy+=(ty*900*sp)*dt;vx*=Math.pow(.06,dt);vy*=Math.pow(.06,dt);vx=Math.max(-320,Math.min(320,vx));vy=Math.max(-260,Math.min(260,vy));px+=vx*dt;py+=vy*dt;px=Math.max(-w*.35,Math.min(w*.35,px));py=Math.max(-h*.28,Math.min(h*.25,py));ring.z-=700*sp*dt;if(ring.z<160){let dx=px-(ring.x*w/900),dy=py-(ring.y*h/900);if(dx*dx/(ring.r*ring.r)+dy*dy/(ring.ry*ring.ry)<1){score++;Q.textContent='リング '+score}nr()}S.textContent='顔認識：操作中　速度 '+sp.toFixed(1)}ring();ship();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('go').onclick=async()=>{try{sp=+document.getElementById('sp').value;const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});v.srcObject=st;await v.play();const fm=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.6,minTrackingConfidence:.6});fm.onResults(r=>{if(r.multiFaceLandmarks?.length){let p=r.multiFaceLandmarks[0][1];face(p.x,p.y)}});const cam=new Camera(v,{onFrame:async()=>fm.send({image:v}),width:640,height:480});await cam.start();run=1;document.getElementById('start').style.display='none'}catch(e){document.getElementById('msg').textContent='起動失敗：カメラ許可とHTTPSを確認してください。';S.textContent='顔認識：起動失敗'}};</script></body></html>
