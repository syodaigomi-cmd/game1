<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>顔操作フライトゲーム 試作</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#071426;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#app{height:100vh;position:relative;background:linear-gradient(#56b9ee 0%,#c9f1ff 58%,#79c76a 100%)}
canvas{width:100%;height:100%;display:block}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);
background:rgba(4,18,35,.88);border:1px solid #6ed7ff;border-radius:22px;padding:24px;text-align:center;box-shadow:0 12px 50px #0008}
h1{margin:0 0 18px;font-size:28px}.speed{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 20px}
button{border:0;border-radius:12px;padding:12px;background:#21415e;color:#fff;font-size:15px;font-weight:700}
button.sel{background:#19a8e8}button.main{width:100%;background:#17b978;font-size:18px}
.small{font-size:12px;color:#bcd2df;line-height:1.5}.hidden{display:none!important}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#06182dcc;border-radius:12px;padding:8px 12px;font-weight:700}
#cam{position:absolute;right:10px;bottom:10px;width:130px;height:95px;object-fit:cover;border-radius:12px;opacity:.55;transform:scaleX(-1);display:none}
#status{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);background:#06182dcc;padding:8px 14px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div class="badge">SCORE <span id="score">0</span></div><div class="badge">速度 <span id="speedHud">普通</span></div></div>
<video id="cam" autoplay playsinline muted></video>
<div id="status" class="hidden">カメラを準備中…</div>

<div id="menu" class="panel">
<h1>✈️ フライトゲーム</h1>
<div>飛行船のデザインを選択</div>
<div class="speed" id="shipChoices">
<button class="sel" data-ship="0">🌸 丸型</button>
<button data-ship="1">☁️ ふわふわ</button>
<button data-ship="2">🎀 ハート型</button>
</div>
<div>飛行速度を選択</div>
<div class="speed">
<button data-speed="1">遅い</button><button class="sel" data-speed="2">普通</button>
<button data-speed="3">速い</button><button data-speed="4">高速</button>
</div>
<div class="small">顔の向きで飛行船を操作します<br>左・右 → 左右移動　上・下 → 上昇・下降</div><br>
<button id="start" class="main">カメラを起動してスタート</button>
</div>

<div id="result" class="panel hidden">
<h1>🎉 ゴール！</h1><p>スコア：<b id="finalScore">0</b></p>
<button id="retry" class="main">もう一度飛ぶ</button>
</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const menu=document.getElementById('menu'),hud=document.getElementById('hud'),result=document.getElementById('result');
const video=document.getElementById('cam'),statusEl=document.getElementById('status');
let W,H,dpr,playing=false,score=0,speed=2,ship=0,faceX=0,faceY=0,controlX=0,controlY=0,ringDist=1,ringX=0,ringY=0,worldX=0,worldY=0,ringShape=0,ringColor='#ffd83d',ringSize=32;
const speeds=[0.00045,0.0007,0.0010,0.00135];
let last=0,particles=[];
let faceReady=false,faceDetected=false,neutralX=.5,neutralY=.5,faceLoopStarted=false;

function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
document.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>{ship=+b.dataset.ship;document.querySelectorAll('[data-ship]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});

function resetRing(){ringDist=1;ringX=(Math.random()*1.6-0.8);ringY=(Math.random()*1.0-0.5);ringShape=Math.floor(Math.random()*6);ringColor=['#ffd83d','#ff8fb3','#7ed6ff','#a9e77b','#b99cff'][Math.floor(Math.random()*5)];ringSize=24+Math.random()*22}
function drawScene(t){
 ctx.clearRect(0,0,W,H);
 // natural landscape background
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#62b8e8');g.addColorStop(.52,'#dff5ff');g.addColorStop(1,'#8bcf78');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant mountain range
 ctx.fillStyle='#91b8c9';ctx.beginPath();ctx.moveTo(0,H*.48);for(let x=0;x<=W;x+=65)ctx.lineTo(x,H*.39-Math.sin(x*.018)*32);ctx.lineTo(W,H*.67);ctx.lineTo(0,H*.67);ctx.fill();
 ctx.fillStyle='#709b91';ctx.beginPath();ctx.moveTo(0,H*.58);for(let x=0;x<=W;x+=55)ctx.lineTo(x,H*.52-Math.sin(x*.026+1.2)*24);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // valley lake
 ctx.fillStyle='#71bfd3';ctx.beginPath();ctx.moveTo(W*.30,H);ctx.quadraticCurveTo(W*.50,H*.67,W*.72,H);ctx.closePath();ctx.fill();
 // foreground forest
 ctx.fillStyle='#4f8d61';for(let x=0;x<W;x+=30){let y=H*.64+Math.sin(x*.035)*13;ctx.beginPath();ctx.moveTo(x,y+42);ctx.lineTo(x+15,y);ctx.lineTo(x+30,y+42);ctx.closePath();ctx.fill()}
 // a few distant trees
 ctx.fillStyle='#5c9a68';for(let x=20;x<W;x+=95){let y=H*.57+Math.sin(x*.05)*10;ctx.beginPath();ctx.moveTo(x,y+28);ctx.lineTo(x+12,y);ctx.lineTo(x+24,y+28);ctx.closePath();ctx.fill()}
 // clouds
 for(let i=0;i<4;i++){let x=((i*317+t*.010)%(W+300))-150,y=95+(i%3)*105;ctx.fillStyle='rgba(255,255,255,.58)';ctx.beginPath();ctx.ellipse(x,y,58,18,0,0,7);ctx.ellipse(x+38,y-6,35,21,0,0,7);ctx.fill()}
 // ring
 if(playing){
   ringDist-=speeds[speed-1]*16;
   if(ringDist<0.05){score++;document.getElementById('score').textContent=score;resetRing()}
   const perspective=1/ringDist,rx=W/2+(ringX-worldX)*W*.32*perspective,ry=H*.47+(ringY-worldY)*H*.28*perspective;
   const r=Math.max(12,ringSize*perspective);
   const sides=[0,3,4,5,6,8][ringShape];
   if(rx>-r&&rx<W+r&&ry>-r&&ry<H+r){ctx.strokeStyle=ringColor;ctx.lineWidth=Math.max(4,r*.16);ctx.beginPath();
     if(sides===0){ctx.arc(rx,ry,r,0,Math.PI*2)}else{for(let k=0;k<sides;k++){const a=-Math.PI/2+k*Math.PI*2/sides;const px=rx+Math.cos(a)*r,py=ry+Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}ctx.stroke();
     ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();
     if(sides===0){ctx.arc(rx,ry,r*.65,0,Math.PI*2)}else{for(let k=0;k<sides;k++){const a=-Math.PI/2+k*Math.PI*2/sides;const px=rx+Math.cos(a)*r*.65,py=ry+Math.sin(a)*r*.65;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}ctx.stroke();
   }
   // aircraft
   drawShip(W/2+controlX*W*.22,H/2+controlY*H*.22);
 }
 requestAnimationFrame(drawScene);
}
function drawShip(x,y){
 ctx.save();ctx.translate(x,y);ctx.rotate(controlX*.10);
 const styles=[
   {body:'#f8a9c4',accent:'#ffd7e5',window:'#9edcf2',prop:'#ffd7a8'},
   {body:'#f7c6d8',accent:'#fff0f5',window:'#a9e3ef',prop:'#f5d9a8'},
   {body:'#f49fbd',accent:'#ffe0eb',window:'#a9d9f0',prop:'#f8c9e0'}
 ];
 const q=styles[ship];
 // soft rounded balloon body: gradient creates the volume, with no outline, tail line, or gondola
 const grad=ctx.createRadialGradient(-18,-25,5,10,8,62);grad.addColorStop(0,'#ffffff');grad.addColorStop(.20,q.accent);grad.addColorStop(.55,q.body);grad.addColorStop(1,'#d77f9f');
 ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,-4,52,43,0,0,Math.PI*2);ctx.fill();
 const shade=ctx.createLinearGradient(-52,0,52,0);shade.addColorStop(0,'rgba(255,255,255,.12)');shade.addColorStop(.5,'rgba(255,190,215,.30)');shade.addColorStop(1,'rgba(150,65,105,.12)');
 ctx.fillStyle=shade;ctx.beginPath();ctx.ellipse(0,-2,50,23,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.42)';ctx.beginPath();ctx.ellipse(-18,-23,19,9,-.25,0,Math.PI*2);ctx.fill();
 // symmetric propellers
 for(const side of [-1,1]){
   ctx.save();ctx.translate(side*59,-3);
   ctx.fillStyle='#ffd9e6';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#e9a6bd';ctx.lineWidth=3;
   for(let a=0;a<4;a++){let ang=a*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(ang)*4,Math.sin(ang)*4);ctx.lineTo(Math.cos(ang)*20,Math.sin(ang)*7);ctx.stroke()}
   ctx.fillStyle=q.prop;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 // clean balloon body — no face and no outline
 ctx.restore();
}
function loop(t){drawScene(t);if(playing){worldX += (faceX-worldX)*.085;worldY += (faceY-worldY)*.085; controlX += (faceX-controlX)*.12; controlY += (faceY-controlY)*.12}}
requestAnimationFrame(loop);

async function start(){
 menu.classList.add('hidden');result.classList.add('hidden');hud.classList.remove('hidden');document.getElementById('speedHud').textContent=['','遅い','普通','速い','高速'][speed];
 statusEl.classList.remove('hidden');statusEl.textContent='カメラを起動中…';
 faceDetected=false;neutralX=.5;neutralY=.5;faceX=0;faceY=0;controlX=0;controlY=0;worldX=0;worldY=0;
 try{
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){throw new Error('SECURE_CONTEXT');}
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false});
  video.srcObject=stream;video.style.display='block';await video.play();
  await loadFace();
  statusEl.textContent='顔を中央に合わせています…';
  playing=true;score=0;document.getElementById('score').textContent=0;resetRing();
 }catch(e){
  console.error(e);
  statusEl.textContent = e.message==='SECURE_CONTEXT' ? '顔操作にはHTTPSまたはlocalhostで開いてください' : 'カメラ/顔認識を開始できません。カメラ許可と通信環境を確認してください';
 }
}
async function loadFace(){
 if(faceLoopStarted)return;
 if(typeof FaceMesh==='undefined')throw new Error('FACEMESH_LOAD');
 faceLoopStarted=true;
 const fm=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
 fm.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
 fm.onResults(r=>{
  if(!r.multiFaceLandmarks?.length){faceDetected=false;return;}
  const p=r.multiFaceLandmarks[0];
  const nose=p[1], eyeL=p[33], eyeR=p[263];
  // 目の中心＋鼻を使って顔の中心を安定させる
  const cx=(nose.x+(eyeL.x+eyeR.x)/2)/2, cy=(nose.y+(eyeL.y+eyeR.y)/2)/2;
  if(!faceDetected){neutralX=cx;neutralY=cy;faceDetected=true;statusEl.textContent='顔認識 ON：顔を動かして飛行船を操作';}
  let dx=cx-neutralX, dy=cy-neutralY;
  if(Math.abs(dx)<.012)dx=0;if(Math.abs(dy)<.012)dy=0;
  // カメラ映像は鏡表示なので左右を反転。感度は高め。
  faceX=Math.max(-1,Math.min(1,-dx*7.0));
  faceY=Math.max(-1,Math.min(1,dy*7.0));
 });
 const tick=async()=>{
  if(video.readyState>=2){try{await fm.send({image:video})}catch(e){console.error(e)}}
  requestAnimationFrame(tick);
 };
 tick();
}
document.getElementById('start').onclick=start;
document.getElementById('retry').onclick=()=>{result.classList.add('hidden');menu.classList.remove('hidden');hud.classList.add('hidden');video.style.display='none';playing=false};
</script>
</body>
</html>
