<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>顔で飛ぶ！飛行船リングチャレンジ 試作版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd8ff;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#17324d}
.panel{position:absolute;background:#ffffffdd;border-radius:18px;padding:12px 16px;box-shadow:0 6px 20px #0002}
#status{left:12px;top:12px;font-size:14px}
#score{right:12px;top:12px;font-weight:700;font-size:18px}
#startBox{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;width:min(88vw,430px)}
button{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:700;background:#2676ff;color:white}
select{font-size:16px;padding:8px;border-radius:10px}
#cam{position:absolute;right:12px;bottom:12px;width:150px;border-radius:14px;opacity:.55;transform:scaleX(-1)}
.small{font-size:12px;line-height:1.5}
</style>
</head>
<body>
<canvas id="game"></canvas><video id="cam" autoplay muted playsinline></video>
<div id="ui">
<div id="status" class="panel">顔認識：待機中</div><div id="score" class="panel">リング 0　速度 0</div>
<div id="startBox" class="panel">
<h2>🎈 顔で飛ぶ！飛行船</h2>
<p>顔を左右・上下に動かして飛行船を操縦します。<br>ホームポジションは画面中央より少し上です。</p>
<p>飛行船：
<select id="shipType"><option value="cute">かわいい飛行船</option><option value="classic">クラシック飛行船</option><option value="cloud">ふわふわ飛行船</option></select></p>
<p>速度：<input id="speed" type="range" min="0.6" max="2.2" step="0.1" value="1.2"></p>
<button id="start">カメラを起動してスタート</button>
<div id="msg" class="small">HTTPS または localhost で開き、カメラを許可してください。</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),video=document.getElementById('cam');
const status=document.getElementById('status'),scoreEl=document.getElementById('score'),box=document.getElementById('startBox'),msg=document.getElementById('msg');
let W,H,run=false,faceReady=false,last=performance.now(),score=0,speed=1.2,shipType='cute';
let ship={x:.5,y:.42,vx:0,vy:0,roll:0,pitch:0},target={x:.5,y:.42},base={x:null,y:null};
let ring={x:.5,y:.42,rx:80,ry:60,shape:'ellipse',hue:190,spin:0};
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function newRing(){let s=['circle','ellipse','hex','star'];ring={x:rand(.18,.82),y:rand(.18,.68),rx:rand(42,115),ry:rand(42,100),shape:s[Math.floor(Math.random()*s.length)],hue:Math.floor(rand(0,360)),spin:rand(0,6.28)}}
function setFace(nx,ny){if(base.x===null){base.x=nx;base.y=ny}target.x=Math.max(0,Math.min(1,.5+(nx-base.x)*3.2));target.y=Math.max(0,Math.min(1,.42+(ny-base.y)*3.2));faceReady=true}
function drawBg(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#72cdf7');g.addColorStop(1,'#d8f5ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8';for(let i=0;i<9;i++){let x=(i*190+(t*.015)%220)-100,y=80+(i%4)*100;ctx.beginPath();ctx.ellipse(x,y,55,22,0,0,7);ctx.ellipse(x+35,y-12,38,28,0,0,7);ctx.fill()}ctx.fillStyle='#9ad27a';ctx.beginPath();ctx.moveTo(0,H*.78);for(let x=0;x<=W;x+=80)ctx.lineTo(x,H*.72+Math.sin(x*.012+t*.00015)*35);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function drawRing(){ctx.save();ctx.lineWidth=14;ctx.strokeStyle=`hsl(${ring.hue} 85% 55%)`;ctx.shadowBlur=18;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();if(ring.shape==='circle'||ring.shape==='ellipse')ctx.ellipse(ring.x*W,ring.y*H,ring.rx,ring.ry,ring.spin,0,6.28);else if(ring.shape==='hex'){for(let i=0;i<6;i++){let a=ring.spin+i*Math.PI/3,X=ring.x*W+Math.cos(a)*ring.rx,Y=ring.y*H+Math.sin(a)*ring.ry;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath()}else{for(let i=0;i<10;i++){let a=ring.spin+i*Math.PI/5,r=i%2?ring.rx*.48:ring.rx,X=ring.x*W+Math.cos(a)*r,Y=ring.y*H+Math.sin(a)*r*(ring.ry/ring.rx);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath()}ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore()}
function drawShip(){let x=ship.x*W,y=ship.y*H;ctx.save();ctx.translate(x,y);ctx.rotate(ship.roll);let sc=Math.min(W,H)/700;ctx.scale(sc,sc);if(shipType==='cloud'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-35,105,45,0,0,7);ctx.ellipse(-55,-35,45,34,0,0,7);ctx.ellipse(55,-35,45,34,0,0,7);ctx.fill()}else{ctx.fillStyle=shipType==='cute'?'#ff9fba':'#d79a55';ctx.beginPath();ctx.ellipse(0,-38,115,42,0,0,7);ctx.fill();ctx.fillStyle='#fff8';ctx.beginPath();ctx.ellipse(-35,-48,30,12,0,0,7);ctx.fill()}ctx.fillStyle='#a56b42';ctx.fillRect(-42,0,84,35);ctx.fillStyle='#f4d3a0';ctx.fillRect(-34,5,68,25);ctx.fillStyle='#6d9fe8';ctx.beginPath();ctx.ellipse(0,15,14,9,0,0,7);ctx.fill();ctx.strokeStyle='#754b36';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-65,-5);ctx.lineTo(-42,8);ctx.moveTo(65,-5);ctx.lineTo(42,8);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-22,35);ctx.lineTo(-55,65);ctx.lineTo(-10,45);ctx.closePath();ctx.moveTo(22,35);ctx.lineTo(55,65);ctx.lineTo(10,45);ctx.closePath();ctx.fill();ctx.restore()}
function update(dt){let ax=(target.x-.5)*7.5*speed,ay=(target.y-.42)*7.5*speed;ship.vx+=ax*dt;ship.vy+=ay*dt;let d=Math.pow(.10,dt);ship.vx*=d;ship.vy*=d;let max=.42*speed;ship.vx=Math.max(-max,Math.min(max,ship.vx));ship.vy=Math.max(-max,Math.min(max,ship.vy));ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;ship.x=Math.max(.10,Math.min(.90,ship.x));ship.y=Math.max(.14,Math.min(.76,ship.y));ship.roll+=(ship.vx*2.2-ship.roll)*Math.min(1,dt*8);ship.pitch+=(-ship.vy*1.5-ship.pitch)*Math.min(1,dt*7);let dx=ship.x*W-ring.x*W,dy=ship.y*H-ring.y*H;if(dx*dx/(ring.rx*ring.rx)+dy*dy/(ring.ry*ring.ry)<.30){score++;newRing()}}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;drawBg(t);if(run){update(dt);drawRing();drawShip();scoreEl.textContent=`リング ${score}　速度 ${(Math.hypot(ship.vx,ship.vy)*80+20).toFixed(0)}`;status.textContent=faceReady?'顔認識：操作中':'顔認識：顔を探しています…'}else{drawRing();drawShip()}requestAnimationFrame(loop)}newRing();requestAnimationFrame(loop);
document.getElementById('start').onclick=async()=>{msg.textContent='カメラを起動しています…';try{speed=+document.getElementById('speed').value;shipType=document.getElementById('shipType').value;score=0;base={x:null,y:null};ship={x:.5,y:.42,vx:0,vy:0,roll:0,pitch:0};const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();const fm=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.55,minTrackingConfidence:.55});fm.onResults(r=>{if(r.multiFaceLandmarks?.length){let p=r.multiFaceLandmarks[0][1];setFace(p.x,p.y)}});const cam=new Camera(video,{onFrame:async()=>{await fm.send({image:video})},width:640,height:480});await cam.start();status.textContent='顔認識：操作中';run=true;box.style.display='none'}catch(e){msg.textContent='起動できませんでした。カメラの許可、HTTPS、通信状態を確認して再試行してください。';status.textContent='顔認識：起動失敗'}};
</script></body></html>
