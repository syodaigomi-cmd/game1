<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>疑似3D飛行船リングアドベンチャー</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8ed8ff;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0}
#ui{position:fixed;left:12px;right:12px;top:10px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:rgba(255,255,255,.86);border-radius:14px;padding:8px 11px;box-shadow:0 3px 12px #0002;font-weight:700}
button{border:0;border-radius:12px;padding:9px 13px;font-weight:800;background:#fff;box-shadow:0 2px 8px #0002}
#speed{width:110px;vertical-align:middle}
#status{font-size:13px}
#camera{position:fixed;right:12px;bottom:58px;width:150px;height:112px;object-fit:cover;border-radius:14px;transform:scaleX(-1);z-index:4;display:none;border:3px solid #fff;box-shadow:0 3px 12px #0003}

#gestureGuide{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;background:#ffffffd9;border-radius:15px;padding:9px 13px;text-align:center;font-size:13px}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(#73cfff,#dff7ff)}
.card{width:min(90vw,430px);background:#fff;border-radius:24px;padding:24px;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px #0003}
.card h1{margin:0 0 10px;font-size:28px}.card p{line-height:1.7}
.big{font-size:18px;background:#55b8ff;color:#fff;padding:14px 28px;border-radius:16px}
</style>
</head>
<body>
<div id="game"></div>
<div id="start"><div class="card">
<h1>🎈 疑似3D 飛行船</h1>
<p>飛行船を操縦して、<b>リングをくぐろう！</b><br>
障害物なし。飛行船は画面中央より少し上がホームポジションです。</p>
<button class="big" id="startBtn">スタート</button>
<p style="font-size:12px">スタート後、視線操作をONにできます。視線操作で飛行船を操縦します。</p>
</div></div>

<div id="ui">
<div class="panel">⭕ リング <span id="score">0</span></div><div class="panel">⏱️ <span id="time">2:00</span></div>
<div class="panel">⏱️ 時間 <select id="duration"><option value="60">1分</option><option value="120" selected>2分</option><option value="180">3分</option></select></div><div class="panel">⚡ 速度 <input id="speed" type="range" min="1" max="10" value="5"> <span id="speedVal">5</span></div>
<div class="panel" id="status">視線操作：準備中</div>
<button id="resetBtn">↻ リセット</button>
</div>

<video id="camera" autoplay playsinline muted></video>
<div id="gestureGuide">👀 視線：左＝左　右＝右　上＝上昇　下＝下降</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js"></script>

<script>
let scene,camera,renderer,ship,ringGroup=[],clouds=[],propellers=[];
let score=0, speed=5, durationSeconds=120, stream=null, gameSeconds=120, gameStart=0, gameEnded=false;
let faceLandmarker=null, gazeActive=false, gazeBusy=false, gazeBaseX=null, gazeBaseY=null, gazeSmoothX=.5, gazeSmoothY=.5, lastGazeTime=0;
let targetX=0,targetY=2.8, shipX=0,shipY=2.8, shipZ=0, velX=0,velY=0;
let lastTime=performance.now();


const $=id=>document.getElementById(id);
$('speed').oninput=e=>{speed=+e.target.value;$('speedVal').textContent=speed};$('duration').onchange=e=>{durationSeconds=+e.target.value;resetGame()};
$('resetBtn').onclick=()=>resetGame();

$('startBtn').onclick=async()=>{ if(!renderer) init(); $('start').style.display='none'; $('status').textContent='視線操作：カメラを起動中…'; await startGaze(); };

function init(){
  const canvas=document.createElement('canvas');
  canvas.id='pseudo3dCanvas'; canvas.width=innerWidth*devicePixelRatio; canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width='100%'; canvas.style.height='100%';
  $('game').appendChild(canvas);
  renderer={domElement:canvas,ctx:canvas.getContext('2d')};
  resize();
  makeShip();
  resetGame();
  addEventListener('resize',resize);
  animate();
}
function makeIsland(i){ }
function makeCloud(i){ }
function makeShip(){ ship={position:{x:0,y:2.8},rotation:{z:0,x:0,y:0}}; shipX=0;shipY=2.8; }
function makeRing(z){
  const colors=['#ff4d6d','#ffd43b','#4dd9ff','#7ee081','#b88cff','#ff8c42'];
  const shapes=['circle','hex','oct'];
  ringGroup.push({x:(Math.random()-.5)*8,y:2.5+(Math.random()-.5)*3,z,shape:shapes[Math.floor(Math.random()*3)],color:colors[Math.floor(Math.random()*colors.length)],size:72+Math.random()*18});
}
function resetGame(){
  gameEnded=false; gameSeconds=durationSeconds; gameStart=performance.now(); $('time').textContent=Math.floor(durationSeconds/60)+':00'; score=0;$('score').textContent=score;ringGroup=[];
  for(let i=0;i<10;i++)makeRing(-20-i*22);
  shipX=0;shipY=2.8;targetX=0;targetY=2.8;velX=0;velY=0;
  gazeBaseX=null;gazeBaseY=null;resetOperationState();
}
function resetOperationState(){ targetX=0;targetY=2.8;velX=0;velY=0; }
function drawRing(ctx,r,scale){
  const x=innerWidth/2+r.x*scale, y=innerHeight*.5-(r.y-2.8)*scale;
  const s=r.size*scale; ctx.save();ctx.translate(x,y);ctx.strokeStyle=r.color;ctx.lineWidth=Math.max(4,7*scale);
  ctx.shadowBlur=12;ctx.shadowColor=r.color;ctx.beginPath();
  if(r.shape==='circle')ctx.arc(0,0,s,0,Math.PI*2);
  else {const n=r.shape==='hex'?6:8;for(let i=0;i<n;i++){const a=i*Math.PI*2/n-Math.PI/2;const px=Math.cos(a)*s,py=Math.sin(a)*s;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();}
  ctx.stroke();ctx.restore();
}
function drawShip(ctx){
  const x=innerWidth/2+shipX*22, y=innerHeight*.5-(shipY-2.8)*22; const sc=.7;
  ctx.save();ctx.translate(x,y);ctx.rotate(-ship.rotation.z*.35);
  ctx.shadowBlur=18;ctx.shadowColor='rgba(0,0,0,.18)';
  ctx.fillStyle='#f7b6d2';ctx.beginPath();ctx.ellipse(0,-18,72*sc,48*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffe6f1';for(const bx of [-30,0,30]){ctx.beginPath();ctx.ellipse(bx*sc,-18,7*sc,43*sc,0,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#e8a6bd';ctx.fillRect(-35*sc,18*sc,70*sc,30*sc);ctx.fillStyle='#bfefff';for(const bx of [-22,0,22]){ctx.beginPath();ctx.arc(bx*sc,32*sc,7*sc,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#fff0a8';for(const bx of [-45,45]){ctx.beginPath();ctx.arc(bx*sc,40*sc,5*sc,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle='#f7b6d2';ctx.lineWidth=5;for(const bx of [-45,45]){ctx.beginPath();ctx.moveTo(bx*sc,40*sc);ctx.lineTo(bx*sc,55*sc);ctx.stroke();}
  ctx.restore();
}
function drawScene(){
  const ctx=renderer.ctx; const w=innerWidth,h=innerHeight;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#83d5ff');g.addColorStop(.62,'#dff7ff');g.addColorStop(1,'#54b9dc');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<8;i++){const cx=(i*173+40)%w,cy=90+(i*67)%180;ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.arc(cx+30,cy+4,23,0,Math.PI*2);ctx.arc(cx-25,cy+8,20,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#36a9d6';ctx.fillRect(0,h*.72,w,h*.28);
  ctx.fillStyle='#55b96a';for(let i=0;i<7;i++){const ix=(i*190+70)%w,iy=h*.72-25-(i%3)*22;ctx.beginPath();ctx.arc(ix,iy,35,0,Math.PI*2);ctx.fill();}
  const horizon=h*.72;ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(0,horizon+i*25);ctx.lineTo(w,horizon+i*25);ctx.stroke();}
  const perspective=Math.max(.35,Math.min(1.45,(horizon-20)/h));
  ringGroup.forEach(r=>{const depth=Math.max(0.25,Math.min(1.8,80/Math.max(20,r.z+100)));drawRing(ctx,r,depth);});
  drawShip(ctx);
}
function animate(){
  requestAnimationFrame(animate); const now=performance.now();
  if(!gameEnded){gameSeconds=Math.max(0,durationSeconds-(now-gameStart)/1000);const mm=Math.floor(gameSeconds/60),ss=Math.floor(gameSeconds%60);$('time').textContent=mm+':'+String(ss).padStart(2,'0');if(gameSeconds<=0){gameEnded=true;$('status').textContent='⏱️ ゴール！ リング '+score+' 個';}}
  const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
  const accel=8.0,damping=Math.pow(0.08,dt);velX+=(targetX-shipX)*accel*dt;velY+=(targetY-shipY)*accel*dt;velX*=damping;velY*=damping;const maxVel=11;velX=THREE.MathUtils.clamp(velX,-maxVel,maxVel);velY=THREE.MathUtils.clamp(velY,-maxVel,maxVel);shipX+=velX*dt;shipY+=velY*dt;shipX=THREE.MathUtils.clamp(shipX,-10,10);shipY=THREE.MathUtils.clamp(shipY,-1,10);ship.position.x=shipX;ship.position.y=shipY;ship.rotation.z=THREE.MathUtils.clamp(-(targetX-shipX)*.34,-1.25,1.25);ship.rotation.x=THREE.MathUtils.clamp((targetY-shipY)*.28,-1.05,1.05);
  const dz=(gameEnded?0:(2+speed*.85))*dt;ringGroup.forEach(r=>{r.z+=dz;r.spin=(r.spin||0)+dt});
  for(const r of ringGroup){const d=Math.hypot(r.x-ship.position.x,r.y-ship.position.y);if(r.z>1&&r.z<3&&d<2.7){score++;$('score').textContent=score;r.z-=150;r.x=(Math.random()-.5)*8;r.y=2.5+(Math.random()-.5)*3}if(r.z>12){r.z-=160;r.x=(Math.random()-.5)*8;r.y=2.5+(Math.random()-.5)*3}}
  drawScene();
}
function resize(){if(!renderer)return;const d=devicePixelRatio;renderer.domElement.width=innerWidth*d;renderer.domElement.height=innerHeight*d;renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';}
</script>

</body>
</html>
